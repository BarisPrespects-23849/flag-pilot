# Settings for Flag Pilot. All rules under [gates] must pass to ship.

[gates]
min_identities_per_arm = 50
min_conversions_per_arm = 5
srm_p_block = 0.001            # block if the sample-ratio-mismatch p-value is below this
max_excluded_share = 0.01      # excluded identities as a share of exposures
ship_variant_chance = 0.95     # chance to beat control at or above this: ship the variant
ship_control_chance = 0.05     # chance at or below this for every variant: ship control

# Extra targets for provision, lifecycle and the simulator (checkout and rehearsal are built in).
[targets.dress]
flag = "flagpilot-dress"
experiment = "flagpilot-dress"
hypothesis = "Dress rehearsal of the full chain on a throwaway flag, with simulated users."
description = "Throwaway flag for the Flag Pilot dress rehearsal. Retire after the cleanup PR."
user_prefix = "dress-user"
variant_key = "new"
variant_value = "new"

[cleanup]
app_paths = ["demo"]           # application code: scanned, rewritten, must end with 0 references
test_paths = ["tests"]         # files marked pytest.mark.flag("<flag>") are deleted with the flag
base_branch = "main"
test_command = ["uv", "run", "--frozen", "pytest", "-q"]

[verify]
sample_identities = 10         # identities evaluated after complete/
timeout_seconds = 60
poll_seconds = 3
