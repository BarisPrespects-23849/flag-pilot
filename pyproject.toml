[project]
name = "flag-pilot"
version = "0.1.0"
description = "An agent that takes a Flagsmith experiment from results to rollout and cleanup."
requires-python = ">=3.12,<3.13"
dependencies = [
    "flagsmith>=6.3.0",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[project.scripts]
flagpilot = "flagpilot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flagpilot"]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
